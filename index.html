<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="JV Electric LLC — residential electrical services in Southwest Washington." />
  <title>JV Electric LLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="JV Electric LLC home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img" focusable="false">
            <path d="M18.7 2 7.9 17.1h6.8L12.9 30l11.2-16.2h-6.8L18.7 2Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">JV ELECTRIC</span>
          <span class="brand-sub">LLC</span>
        </span>
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#reviews">Reviews</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="desktop-actions">
        <a class="emergency-link" href="#contact">
          <span class="status-dot" aria-hidden="true"></span>
          24/7 Emergency Service
        </a>
        <a class="estimate-btn" href="#contact">Get an Estimate</a>
      </div>

      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <div class="mobile-menu" id="mobile-menu">
      <nav aria-label="Mobile navigation">
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#reviews">Reviews</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="mobile-menu-footer">
        <p><span class="status-dot" aria-hidden="true"></span> 24/7 Emergency Service</p>
        <a class="estimate-btn" href="#contact">Get an Estimate</a>
      </div>
    </div>
  </header>

  <main>
    <section class="preview-space" id="home" aria-label="Header preview area">
      <p>Hero section goes here next.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
